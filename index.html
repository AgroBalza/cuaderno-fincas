/* Layout: mobile app shell. Sticky app bar + fixed bottom tab bar on phones; left sidebar on wide screens. Cards on a soft ground. */
:root {

  --shadow:0 1px 2px rgba(26,28,32,.05), 0 6px 18px rgba(26,28,32,.05);
  --f-display:'Inter', -apple-system, 'Segoe UI', system-ui, sans-serif;
  --f-body:'Inter', -apple-system, 'Segoe UI', system-ui, sans-serif;
  --f-num:'Inter', -apple-system, 'Segoe UI', system-ui, sans-serif;

  --r:16px; --r-s:12px; --side:236px; --bottom:64px;
}

  --paramo:#D2A271; --paramo-2:#E0B788; --paramo-soft:#2E241A; --papa:#D9AE7C; --papa-soft:#30261A; --tierra:#9FB2C4; --tierra-soft:#1F2730;
  --good:#8CC4A6; --warn:#E0B062; --bad:#EE8E7A; --on-accent:#16130F; --hero:#1B1D22; --hero-ink:#F1ECE4; --hero-muted:#ABA59C; --logo-gap:#1B1D22;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark; } }
:root[data-theme="dark"] {

  --paramo:#D2A271; --paramo-2:#E0B788; --paramo-soft:#2E241A; --papa:#D9AE7C; --papa-soft:#30261A; --tierra:#9FB2C4; --tierra-soft:#1F2730;
  --good:#8CC4A6; --warn:#E0B062; --bad:#EE8E7A; --on-accent:#16130F; --hero:#1B1D22; --hero-ink:#F1ECE4; --hero-muted:#ABA59C; --logo-gap:#1B1D22;

body::before { content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top, 0px); z-index:30; background:var(--surface); }

.sheet { position:fixed; left:0; right:0; bottom:0; z-index:41; background:var(--surface); border-radius:20px 20px 0 0; padding:10px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); box-shadow:0 -8px 30px rgba(0,0,0,.18); max-width:560px; margin:0 auto; }
.sheet { max-height:85vh; overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; }
html.lock, html.lock body { overflow:hidden; overscroll-behavior:none; }
.scrim { touch-action:none; }
.appbar .logo, .side-brand { cursor:pointer; }
html, body { touch-action:pan-x pan-y; }
#view { zoom:var(--zoom, 1); }
.zoom-pill { position:fixed; left:50%; top:calc(70px + env(safe-area-inset-top, 0px)); transform:translateX(-50%); z-index:50; background:var(--ink); color:var(--surface); font:600 0.85rem var(--f-body); padding:6px 12px; border-radius:20px; pointer-events:none; }
.seg + .seg, .seg + .panel { margin-top:12px; }
.t-insumo { background:var(--sunk); color:var(--paramo); }
/* calm: explanations only on demand, actions only on tap */
body:not(.ayuda) .help { display:none; }
.help-t { appearance:none; flex:none; width:32px; height:32px; border-radius:50%; border:1px solid var(--line-strong); background:var(--surface); color:var(--muted); font:700 0.95rem var(--f-body); cursor:pointer; display:grid; place-items:center; }
body.ayuda .help-t { background:var(--paramo); border-color:var(--paramo); color:var(--surface); }
.help { border-left:3px solid var(--papa); padding-left:10px; }
.item.tapable { cursor:pointer; }
.item.tapable:not(.open) .acts.tap, .item:not(.open) .acts .more { display:none; }
.item.tapable:not(.open) .a::after { content:''; }
.item.open { background:color-mix(in srgb, var(--sunk) 55%, transparent); }
.acts .more { display:contents; }

.lote-n { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:8px; margin:10px 0 4px; }
.lote-n div { display:flex; flex-direction:column; min-width:0; }

details.lote-more > summary, details.cat-more > summary, details.extra > summary { cursor:pointer; color:var(--paramo); font-weight:600; font-size:0.88rem; padding:6px 0; list-style:none; }
details.lote-more > summary::-webkit-details-marker, details.cat-more > summary::-webkit-details-marker, details.extra > summary::-webkit-details-marker { display:none; }

details[open].lote-more > summary::after, details[open].cat-more > summary::after, details[open].extra > summary::after { content:' ▴'; }
.lote:not(:has(details.lote-more[open])) .btns .btn.ghost { display:none; }

.amt { order:-2; }

.cat-grid { display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:8px; }
.cat { appearance:none; border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:var(--r-s); padding:10px 2px 8px; font:600 0.74rem/1.15 var(--f-body); display:flex; flex-direction:column; align-items:center; gap:6px; cursor:pointer; text-align:center; min-width:0; }

.tab:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible { outline:2px solid var(--paramo); outline-offset:2px; }
