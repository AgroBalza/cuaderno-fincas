<style>
/* Layout: mobile app shell. Sticky app bar + fixed bottom tab bar on phones; left sidebar on wide screens. Cards on a soft ground. */
:root {

  --paramo:#79C49C; --paramo-2:#8FD3AE; --paramo-soft:#1B3328; --papa:#E3B05A; --papa-soft:#342A15; --tierra:#E5937A; --tierra-soft:#3A231C;
  --good:#79C49C; --warn:#E3B05A; --bad:#F08A73; --on-accent:#0E1411; --hero:#1A3B2C; --hero-ink:#EAF4EE; --hero-muted:#9FC2AE;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark; } }
:root[data-theme="dark"] {
  --bg:#0E1411; --surface:#161F1A; --sunk:#1C2620; --ink:#E4ECE6; --muted:#98AA9D; --line:#25302A; --line-strong:#34413A;
  --paramo:#79C49C; --paramo-2:#8FD3AE; --paramo-soft:#1B3328; --papa:#E3B05A; --papa-soft:#342A15; --tierra:#E5937A; --tierra-soft:#3A231C;

.ico.s { width:18px; height:18px; }

.side { display:none; }

.bt.fab .ico { width:24px; height:24px; stroke-width:2.4; }
/* sheet */
.scrim { position:fixed; inset:0; background:rgba(10,20,14,.38); z-index:40; }
.sheet { position:fixed; left:0; right:0; bottom:0; z-index:41; background:var(--surface); border-radius:20px 20px 0 0; padding:10px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); box-shadow:0 -8px 30px rgba(0,0,0,.18); max-width:560px; margin:0 auto; }
.grab { width:40px; height:4px; border-radius:4px; background:var(--line-strong); margin:0 auto 12px; }
.sheet-list { display:flex; flex-direction:column; }
.sheet-list button { appearance:none; border:0; background:none; color:var(--ink); display:flex; align-items:center; gap:14px; padding:14px 6px; font:600 1rem var(--f-body); text-align:left; border-bottom:1px solid var(--line); cursor:pointer; }
.sheet-list button:last-child { border-bottom:0; }
.sheet-list .ic { width:38px; height:38px; border-radius:12px; background:var(--sunk); color:var(--paramo); display:grid; place-items:center; flex:none; }
.sheet-list small { display:block; color:var(--muted); font-weight:400; font-size:0.82rem; }
@media (prefers-reduced-motion: no-preference) { .sheet { animation:up .22s ease-out; } @keyframes up { from { transform:translateY(30px); opacity:.6 } to { transform:none; opacity:1 } } }
@media (min-width:960px) {
  .side { display:flex; flex-direction:column; gap:4px; position:fixed; top:0; bottom:0; left:0; width:var(--side); background:var(--surface); border-right:1px solid var(--line); padding:calc(18px + env(safe-area-inset-top, 0px)) 12px 16px max(12px, env(safe-area-inset-left, 0px)); z-index:22; }
  .side-brand { display:flex; align-items:center; gap:10px; padding:4px 8px 18px; }
  .side-brand b { font-family:var(--f-display); font-size:1.05rem; line-height:1.15; display:block; }
  .side-brand small { color:var(--muted); font-size:0.75rem; }

  .sn:hover { background:var(--sunk); color:var(--ink); }
  .sn[aria-current="page"] { background:var(--paramo-soft); color:var(--paramo); }
  .sn.cta { background:var(--paramo); color:var(--on-accent); margin:2px 0 12px; justify-content:flex-start; }

  .bottom { display:none; }
  main.view { padding-bottom:48px; }
  .appbar .logo { display:none; }
  .appbar-in { padding-block:14px; padding-left:28px; padding-right:28px; }

}
.tab:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible { outline:2px solid var(--paramo); outline-offset:2px; }
section { display:flex; flex-direction:column; gap:12px; min-width:0; }

.num { font-family:var(--f-num); font-variant-numeric:tabular-nums; }

.bar { height:8px; border-radius:8px; background:rgba(255,255,255,.14); overflow:hidden; }

.tbl td:first-child, .tbl th:first-child { position:sticky; left:0; background:var(--surface); z-index:1; }
.tbl tr.total td:first-child { background:var(--sunk); }
.pos { color:var(--good); } .neg { color:var(--bad); }
.chip { display:inline-flex; align-items:center; gap:4px; font-size:0.7rem; font-weight:700; padding:2px 8px; border-radius:99px; white-space:nowrap; letter-spacing:0.02em; }
.c-gasto { background:var(--tierra-soft); color:var(--tierra); }

.btn { appearance:none; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); font:700 0.92rem var(--f-body); padding:9px 16px; border-radius:12px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; justify-content:center; min-height:42px; }
.btn:hover { border-color:var(--muted); }
.btn.primary { background:var(--paramo); border-color:var(--paramo); color:var(--on-accent); box-shadow:0 2px 8px rgba(31,90,64,.25); }

.btn.block { width:100%; min-height:50px; font-size:1rem; }

.btns { display:flex; flex-wrap:wrap; gap:8px; }
.seg { display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:8px; }

.t-gasto { background:var(--tierra-soft); color:var(--tierra); } .t-cosecha { background:var(--paramo-soft); color:var(--paramo); } .t-venta { background:var(--papa-soft); color:var(--papa); } .t-precio { background:var(--sunk); color:var(--ink); }
form.grid, .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); gap:12px; }
.field { display:flex; flex-direction:column; gap:5px; min-width:0; }

label { font-size:0.8rem; font-weight:700; color:var(--muted); }

.hint { font-size:0.8rem; color:var(--muted); }

.notice.ok { background:var(--paramo-soft); }

.list { display:flex; flex-direction:column; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); overflow:hidden; box-shadow:var(--shadow); }
.item { display:grid; grid-template-columns:40px minmax(0, 1fr) auto; gap:2px 12px; padding:12px 14px; border-bottom:1px solid var(--line); align-items:start; }
.item:last-child { border-bottom:0; }
.av { width:40px; height:40px; border-radius:12px; display:grid; place-items:center; grid-row:span 2; }
.item .t { font-weight:700; overflow-wrap:anywhere; line-height:1.3; }
.item .s { font-size:0.82rem; color:var(--muted); overflow-wrap:anywhere; }
.item .a { font-family:var(--f-num); text-align:right; white-space:nowrap; font-size:0.95rem; }

.month-h { padding:8px 14px; background:var(--sunk); font-weight:700; font-size:0.78rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--muted); display:flex; justify-content:space-between; gap:8px; border-bottom:1px solid var(--line); }
.alerts { display:flex; flex-direction:column; gap:8px; }

svg.chart { width:100%; height:auto; display:block; max-width:100%; }
